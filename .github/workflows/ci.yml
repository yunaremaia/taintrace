name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep this in step with the Programming Language :: Python :: 3.x
        # classifiers in pyproject.toml. 3.14 is the current stable release and
        # PyPI's version filter hides a package from anyone filtering by it
        # unless the matching classifier is published, so a leg missing here
        # means an untested version advertised as tested (or vice versa).
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      # The coverage floor is configured once in pyproject.toml
      # ([tool.coverage.report] fail_under). pytest-cov picks it up from there,
      # so this step fails the job when coverage drops -- it is not just a
      # printed number. Do not add --cov-fail-under here: two floors would let
      # one silently weaken the other.
      - name: Test
        run: python -m pytest tests/ -v --cov=taintrace --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff is a dev dependency so the gate uses the same version locally and
      # in CI. The selection lives in ruff.toml, not here, so widening it is a
      # config change rather than a silent divergence between the two.
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      # --strict turns an INFO about a broken intra-doc link into a build
      # failure, so a nav entry or anchor typo cannot merge silently.
      - run: mkdocs build --strict
      # Without site_url, mkdocs emits an EMPTY <urlset/> and the site drops
      # out of sitemap-based discovery entirely. A green build proves nothing
      # about this, so assert on the artifact instead.
      - name: Assert the sitemap has entries
        run: |
          test -f site/sitemap.xml
          count=$(grep -c '<url>' site/sitemap.xml || true)
          echo "sitemap entries: $count"
          test "$count" -gt 0
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, docs]
    runs-on: ubuntu-latest
    # The concurrency group belongs on the JOB, not the workflow: a
    # workflow-level group would let an older commit reaching deploy cancel a
    # newer commit's still-running test matrix.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
