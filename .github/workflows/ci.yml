name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      # The coverage floor is configured once in pyproject.toml
      # ([tool.coverage.report] fail_under). pytest-cov picks it up from there,
      # so this step fails the job when coverage drops -- it is not just a
      # printed number. Do not add --cov-fail-under here: two floors would let
      # one silently weaken the other.
      - name: Test
        run: python -m pytest tests/ -v --cov=taintrace --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff is a dev dependency so the gate uses the same version locally and
      # in CI. The selection lives in ruff.toml, not here, so widening it is a
      # config change rather than a silent divergence between the two.
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
