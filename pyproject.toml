[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taintrace"
version = "0.2.2"
description = "Typosquat detector for AI coding agent dependencies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
keywords = [
    "security",
    "supply-chain",
    "typosquat",
    "typosquatting",
    "dependency-confusion",
    "package-name",
    "pypi",
    "npm",
    "maven",
    "ai-agents",
    "dependencies",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
taintrace = "taintrace.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
# No docs site is deployed for this repo, so Homepage deliberately stays on the
# repository: PyPI already links the source, and a link to a docs/ directory
# that is not served would be a dead link on the project's most visible page.
Homepage = "https://github.com/yunaremaia/taintrace"
Source = "https://github.com/yunaremaia/taintrace"
Issues = "https://github.com/yunaremaia/taintrace/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/taintrace/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# The java known-package coordinates are shipped as package data: dropping them
# from the wheel would silently empty the java ecosystem (issue #77).
[tool.setuptools.package-data]
taintrace = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/taintrace"]

# The gate. ``[tool.coverage.run]`` alone only *measures* coverage: pytest-cov
# printed the number and exited 0 whatever it said, so a regression landed
# silently. ``fail_under`` here is the single source of truth for both local and
# CI runs -- do NOT move it to a --cov-fail-under flag in the workflow.
#
# ``precision = 2`` is what makes this strict: coverage compares the total
# ROUNDED to that precision. At the default precision of 0 a fail_under of 99
# would accept anything from 98.51% upward -- a full point of silent rot below
# the number it reads as. At precision 2 this floor rejects the run as soon as
# a single further statement goes uncovered.
#
# 1093/1094 statements = 99.91%. The one uncovered statement is the trailing
# `else: clean[key] = v` in validate_config, which is unreachable: every key in
# VALID_CONFIG_KEYS is matched by an explicit branch above it. If that branch is
# ever reachable, add a test for it rather than lowering this number.
[tool.coverage.report]
precision = 2
fail_under = 99.9
show_missing = true
