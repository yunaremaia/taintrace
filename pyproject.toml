[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taintrace"
version = "0.2.5"
description = "Typosquat detector for AI coding agent dependencies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
keywords = [
    "security",
    "supply-chain",
    "typosquat",
    "typosquatting",
    "dependency-confusion",
    "package-name",
    "pypi",
    "npm",
    "maven",
    "ai-agents",
    "dependencies",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    # config.py parses the TOML and YAML config files through a
    # tomllib/tomli and a yaml/pyyaml try/except. Without these declared, a
    # `pip install` of the wheel silently ignores the user's config on the
    # interpreters where the stdlib tomllib is absent or PyYAML is missing --
    # an ignored package is then reported as a CRITICAL typosquat. The YAML
    # fallback parser is a hand-rolled subset, so it silently disagrees with
    # real YAML on constructs as ordinary as a trailing comment.
    "tomli>=2.0; python_version < '3.11'",
    "pyyaml>=6.0",
]

[project.scripts]
taintrace = "taintrace.cli:cli"

[project.optional-dependencies]
# ruff backs the lint CI job, so it lives here rather than being installed
# ad hoc in the workflow: local and CI then run the same version.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.16.10"]

[project.urls]
# Homepage is the documentation site, not the repository: PyPI already renders
# the source next to this list, so the prominent slot earns its place by
# pointing at the guides a visitor actually lands on. Both URLs below are
# served by the `docs`/`deploy-docs` jobs in .github/workflows/ci.yml -- they are
# NOT links to the docs/ directory in this repository, which is a source tree,
# not a site. `Documentation` deep-links to the first guide rather than repeating
# `Homepage`, so the landing page does not advertise one URL twice.
Homepage = "https://yunaremaia.github.io/taintrace/"
Documentation = "https://yunaremaia.github.io/taintrace/getting-started/"
Source = "https://github.com/yunaremaia/taintrace"
Issues = "https://github.com/yunaremaia/taintrace/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/taintrace/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# The java known-package coordinates are shipped as package data: dropping them
# from the wheel would silently empty the java ecosystem (issue #77).
[tool.setuptools.package-data]
taintrace = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/taintrace"]

# The gate. ``[tool.coverage.run]`` alone only *measures* coverage: pytest-cov
# printed the number and exited 0 whatever it said, so a regression landed
# silently. ``fail_under`` here is the single source of truth for both local and
# CI runs -- do NOT move it to a --cov-fail-under flag in the workflow.
#
# ``precision = 2`` is what makes this strict: coverage compares the total
# ROUNDED to that precision. At the default precision of 0 a fail_under of 99
# would accept anything from 98.51% upward -- a full point of silent rot below
# the number it reads as. At precision 2 this floor rejects the run as soon as
# a single further statement goes uncovered.
#
# The suite covers every statement (100.00%), so the floor has no headroom
# left: any new uncovered line fails the run. That is the point -- two silent
# defects were found this way (a duplicate test class shadowing its own tests,
# and a guard no input could reach). If a line is genuinely unreachable, delete
# it rather than lowering this number.
[tool.coverage.report]
precision = 2
fail_under = 99.9
show_missing = true
